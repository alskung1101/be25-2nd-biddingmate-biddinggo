apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.webhook.discord: |
    url: $discord-webhook-url
    headers:
      - name: Content-Type
        value: application/json

  template.app-sync-succeeded: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "content": "[Argo CD] 배포 완료 - Application: {{.app.metadata.name}} - Sync: {{.app.status.sync.status}} - Health: {{.app.status.health.status}} - Revision: {{.app.status.sync.revision}}"
          }

  template.app-sync-failed: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "content": "[Argo CD] 배포 실패 - Application: {{.app.metadata.name}} - Sync: {{.app.status.sync.status}} - Health: {{.app.status.health.status}}"
          }

  template.app-health-degraded: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "content": "[Argo CD] 상태 이상 - Application: {{.app.metadata.name}} - Sync: {{.app.status.sync.status}} - Health: {{.app.status.health.status}}"
          }

  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      send: [app-sync-succeeded]

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]
