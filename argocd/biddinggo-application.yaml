apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: biddinggo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alskung1101/be25-2nd-biddingmate-biddinggo.git
    targetRevision: feature/deploy-setup
    path: k8s/dockerhub
  destination:
    server: https://kubernetes.default.svc
    namespace: biddinggo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
