apiVersion: apps/v1
kind: Deployment
metadata:
  name: biddinggo-backend
  namespace: biddinggo
  labels:
    app: biddinggo-backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: biddinggo-backend
  template:
    metadata:
      labels:
        app: biddinggo-backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: biddinggo-backend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
          envFrom:
            - secretRef:
                name: biddinggo-backend-secret
            - configMapRef:
                name: biddinggo-backend-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
