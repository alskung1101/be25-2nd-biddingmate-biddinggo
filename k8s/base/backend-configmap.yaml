apiVersion: v1
kind: ConfigMap
metadata:
  name: biddinggo-backend-config
  namespace: biddinggo
data:
  SPRING_PROFILES_ACTIVE: local
  SERVER_PORT: "8080"
  DB_HOST: biddinggo-mariadb
  DB_PORT: "3306"
  DB_NAME: biddinggo
  REDIS_HOST: biddinggo-redis
  REDIS_PORT: "6379"
  FRONTEND_REDIRECT_URI: http://localhost:5173/auth/callback
  FRONTEND_URL: http://localhost:*,http://127.0.0.1:*
