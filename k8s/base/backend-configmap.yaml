apiVersion: v1
kind: ConfigMap
metadata:
  name: biddinggo-backend-config
  namespace: biddinggo
data:
  SPRING_PROFILES_ACTIVE: local
  SERVER_PORT: "8080"
  DB_HOST: biddinggo-mariadb
  DB_PORT: "3306"
  DB_NAME: biddinggo
  REDIS_HOST: biddinggo-redis
  REDIS_PORT: "6379"
  GOOGLE_REDIRECT_URI: http://localhost:30080/login/oauth2/code/google
  KAKAO_REDIRECT_URI: http://localhost:30080/login/oauth2/code/kakao
  FRONTEND_REDIRECT_URI: http://localhost:30080/auth/callback
  FRONTEND_URL: http://localhost:30080,http://127.0.0.1:30080
